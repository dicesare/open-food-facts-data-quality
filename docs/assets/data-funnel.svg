<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d"><title id="t">Open Food Facts historical data funnel</title><desc id="d">Dataset narrows from 320772 products and 162 columns to 36 selected fields and a French subset.</desc><rect width="960" height="430" fill="#0f172a"/><text x="45" y="50" fill="#f8fafc" font-family="Arial" font-size="26" font-weight="700">P3 — from a sparse open dataset to an auditable dataset</text><text x="45" y="80" fill="#94a3b8" font-family="Arial" font-size="14">Verified checkpoints from the historical notebooks</text><polygon points="100,125 860,125 770,215 190,215" fill="#0ea5e9"/><polygon points="190,230 770,230 660,315 300,315" fill="#38bdf8"/><polygon points="300,330 660,330 590,400 370,400" fill="#7dd3fc"/><g font-family="Arial" text-anchor="middle"><text x="480" y="165" fill="#fff" font-size="23" font-weight="700">320,772 products · 162 columns</text><text x="480" y="190" fill="#e0f2fe" font-size="14">raw Open Food Facts snapshot</text><text x="480" y="266" fill="#082f49" font-size="22" font-weight="700">36 retained variables</text><text x="480" y="290" fill="#0c4a6e" font-size="14">missingness + semantic relevance</text><text x="480" y="365" fill="#082f49" font-size="21" font-weight="700">≈98,468 French products</text><text x="480" y="388" fill="#0c4a6e" font-size="13">quality analysis and visual delivery</text></g></svg>

